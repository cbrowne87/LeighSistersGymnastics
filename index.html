<div class="pledge-form">
    <h3>Make a Pledge</h3>

    <form id="pledgeForm"
          action="https://script.google.com/macros/s/AKfycbw3bPtGqBhR6m49Rxh-Srcr-FnUeU1w1WbZYCoPahQH0ca3NilD9psvcTH2vDWXZO008g/exec"
          method="POST"
          target="pledge-response-frame">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone / WhatsApp</label>
            <input type="tel" id="phone" name="phone" placeholder="Your contact number">
        </div>

        <div class="form-group">
            <label for="amount">Pledge Amount</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   min="0"
                   step="50"
                   placeholder="Enter amount"
                   required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message"
                      name="message"
                      placeholder="Leave a message for the Leigh Sisters..."></textarea>
        </div>

        <button type="submit"
                class="submit-button"
                id="submitPledgeButton">
            Submit My Pledge
        </button>

        <p id="pledgeStatus"
           class="pledge-status"
           role="status"
           aria-live="polite"></p>

        <div class="payment-instructions">
            <strong>Pledges can be sent to:</strong><br>
            Curlene Browne<br>
            Republic Bank Chequing Account<br>
            <strong>1601 3259 0701</strong>
        </div>

        <iframe name="pledge-response-frame"
                id="pledge-response-frame"
                title="Pledge submission response"
                style="display:none;">
        </iframe>

    </form>
</div>
